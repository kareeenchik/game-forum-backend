version: '3.8'

services:
  auth_service:
    build: ./auth_service
    container_name: auth_service
    ports:
      - "8001:8000"
    volumes:
      - ./auth_service:/app
    environment:
      - PYTHONUNBUFFERED=1

  forum_service:
    build: ./forum_service
    container_name: forum_service
    ports:
      - "8002:8000"
    volumes:
      - ./forum_service:/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - statistics_service

  statistics_service:
    build: ./statistics_service
    container_name: statistics_service
    ports:
      - "8003:8000"
    volumes:
      - ./statistics_service:/app
    environment:
      - PYTHONUNBUFFERED=1
    # Добавляем алиас stats для обхода ошибки RFC (подчеркивания)
    networks:
      default:
        aliases:
          - stats