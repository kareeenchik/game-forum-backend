<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Game Forum | Microservices Audit</title>
    <style>
        :root { --green: #2ecc71; --dark: #121212; --card: #1e1e1e; --text: #e0e0e0; --red: #e74c3c; }
        body { background: var(--dark); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; padding-bottom: 50px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        .notification { position: fixed; top: 20px; right: 20px; background: var(--green); color: white; padding: 15px 25px; border-radius: 8px; z-index: 1000; animation: slideIn 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-weight: bold; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        input, textarea, select { width: 100%; background: #252525; border: 1px solid #333; color: white; padding: 12px; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--green); }
        
        button { cursor: pointer; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .btn-primary { background: var(--green); color: white; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-secondary { background: #444; color: white; }
        .btn-refresh { background: transparent; color: var(--green); border: 1px solid var(--green); padding: 5px 10px; }
        
        .admin-panel { border: 1px solid var(--red); }
        .log-container { background: #000; border-radius: 6px; padding: 15px; font-family: 'Consolas', monospace; font-size: 12px; max-height: 250px; overflow-y: auto; color: #adadad; }
        .log-entry { border-bottom: 1px solid #222; padding: 5px 0; display: flex; gap: 10px; }
        .log-action { color: var(--red); font-weight: bold; min-width: 100px; }

        .topic-item { background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--green); transition: 0.3s; }
        .topic-item:hover { background: #2d2d2d; }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .auth-tabs button { flex: 1; background: #333; color: #888; }
        .auth-tabs button.active { background: var(--green); color: white; }
        
        #log-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 8px 15px; font-size: 12px; color: #888; border-top: 1px solid #333; z-index: 1001; }
    </style>
</head>
<body>

    <div id="notification-toast" class="notification hidden">
        🔔 <span id="notification-msg"></span>
    </div>

    <div id="auth-page" class="card" style="max-width: 400px; margin: 80px auto;">
        <div class="auth-tabs">
            <button onclick="switchAuth('login')" id="tab-login" class="active">Вход</button>
            <button onclick="switchAuth('register')" id="tab-register">Регистрация</button>
        </div>
        <div id="login-form">
            <input type="text" id="user" placeholder="Логин">
            <input type="password" id="pass" placeholder="Пароль">
            <button onclick="handleLogin()" class="btn-primary" style="width:100%">Войти в систему</button>
        </div>
        <div id="register-form" class="hidden">
            <input type="text" id="reg-user" placeholder="Придумайте логин">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-pass" placeholder="Придумайте пароль">
            <button onclick="handleRegister()" class="btn-primary" style="width:100%">Создать аккаунт</button>
        </div>
    </div>

    <div id="main-page" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin:0;">🎮 GameForum <span style="font-weight: normal; font-size: 0.5em; vertical-align: middle; color: #666;"></span></h2>
            <button onclick="handleLogout()" class="btn-secondary">Выйти</button>
        </div>

        <div id="admin-monitor" class="card admin-panel hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: var(--red); margin: 0;">🕵️ Аудит событий (Service 3: Consumer)</h3>
                <button onclick="loadAuditLogs()" class="btn-refresh">🔄 Запросить логи</button>
            </div>
            <div id="audit-logs-list" class="log-container">
                Нажмите «Запросить логи» для получения данных из Consumer Service...
            </div>
            <div id="admin-category-panel" class="card admin-panel hidden" style="border-color: var(--green);">
                <h3 style="color: var(--green); margin-top: 0;">📁 Управление категориями</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="new-category-name" placeholder="Название новой категории (например, Обзоры)" style="margin:0;">
                    <button onclick="handleCreateCategory()" class="btn-primary">Создать</button>
                </div>
            </div>
        </div>

        <div class="create-topic-section card">
            <h3>✨ Создать новую тему</h3>
            <select id="topic-category-select">
                <option value="">Загрузка категорий...</option>
            </select>
            <input type="text" id="topic-title" placeholder="Заголовок обсуждения (например, Гайд по боссу)">
            <textarea id="topic-content" placeholder="Расскажите подробнее..." rows="3"></textarea>
            <button onclick="handleCreateTopic()" class="btn-primary">Опубликовать на форуме</button>
        </div>

        <div class="topics-feed-section">
            <div class="card" style="background: #151515; display: flex; align-items: center; gap: 15px;">
                <span>📂 Фильтр:</span>
                <select id="filter-category" onchange="loadTopics()" style="margin: 0; width: auto; flex: 1;">
                    <option value="">Все категории (Гайды, Обзоры, Новости)</option>
                </select>
                <button onclick="loadTopics()" class="btn-refresh">🔄</button>
            </div>
            <div id="topics-list"></div>
        </div>
    </div>

    <div id="topic-detail" class="hidden">
        <div class="card">
            <button onclick="showMain()" class="btn-secondary">← Назад к ленте</button>
            <h2 id="current-topic-title" style="color: var(--green); margin-top: 20px;"></h2>
            <p id="current-topic-content" style="white-space: pre-wrap; line-height: 1.6;"></p>
        </div>
        
        <div class="card">
            <h3>💬 Обсуждение</h3>
            <div id="comments-list" style="min-height: 50px;"></div>
            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
            <textarea id="comment-text" placeholder="Ваше мнение..." rows="2"></textarea>
            <button onclick="handleSendComment()" class="btn-primary" style="width:100%">Отправить комментарий</button>
        </div>
    </div>

    <div id="log-bar">Состояние: Ожидание действий пользователя</div>

    <script src="app.js"></script>
</body>
</html>
